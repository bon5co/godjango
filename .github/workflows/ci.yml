name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: mkdir -p test-results/logs
      - name: Formatting
        run: scripts/ci.sh format 2>&1 | tee test-results/logs/format.log
      - name: Dependencies
        run: scripts/ci.sh dependencies 2>&1 | tee test-results/logs/dependencies.log
      - name: Licenses
        run: scripts/ci.sh licenses 2>&1 | tee test-results/logs/licenses.log
      - name: Build
        run: scripts/ci.sh build 2>&1 | tee test-results/logs/build.log
      - name: Vet
        run: scripts/ci.sh vet 2>&1 | tee test-results/logs/vet.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-failure-${{ github.run_attempt }}
          path: test-results/logs/
          if-no-files-found: ignore
          retention-days: 14

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: mkdir -p test-results/logs
      - name: Race-enabled unit tests
        run: scripts/ci.sh race 2>&1 | tee test-results/logs/race.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-failure-${{ github.run_attempt }}
          path: test-results/logs/
          if-no-files-found: ignore
          retention-days: 14

  generated:
    name: Generated project
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: mkdir -p test-results/logs
      - name: Generated-project smoke tests
        run: scripts/ci.sh generated 2>&1 | tee test-results/logs/generated.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-failure-${{ github.run_attempt }}
          path: test-results/logs/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: godjango
          POSTGRES_DB: godjango
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d godjango"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      GODJANGO_TEST_DATABASE_URL: postgres://postgres:godjango@127.0.0.1:5432/godjango?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: mkdir -p test-results/logs
      - name: PostgreSQL integration tests
        run: scripts/ci.sh integration 2>&1 | tee test-results/logs/integration.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-failure-${{ github.run_attempt }}
          path: test-results/logs/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: godjango
          POSTGRES_DB: godjango
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d godjango"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      GODJANGO_TEST_DATABASE_URL: postgres://postgres:godjango@127.0.0.1:5432/godjango?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Install pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.71
      - run: mkdir -p test-results/logs
      - name: Headed browser E2E
        env:
          GODJANGO_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          xvfb-run -a -s "-screen 0 1440x1000x24"
          scripts/ci.sh e2e 2>&1 | tee test-results/logs/e2e.log
      - name: Upload failure logs and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_attempt }}
          path: |
            test-results/logs/
            test-results/auth-e2e/
          if-no-files-found: ignore
          retention-days: 14
